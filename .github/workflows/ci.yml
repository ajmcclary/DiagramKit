# GENERATED by Scripts/sync-package-ci in the CodeEditor workspace superproject.
# Edit the generator there, not this file: `Scripts/sync-package-ci --check`
# (run by Scripts/verify-all) fails when this file drifts.
name: CI

# Pushes to main run nothing (owner decision, 2026-10-08: commits land on
# main directly and the full suite is heavy). The full suite runs on release
# tags, on pull requests (documentation-only PRs skip, see `paths`), weekly,
# and on manual dispatch (Actions > CI > Run workflow).
on:
  push:
    tags: ["*"]
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE*'
      - '!.gitignore'
  schedule:
    # Weekly, so upstream dependency rot (a dead submodule URL, a yanked tag)
    # surfaces within days instead of at the next push.
    - cron: "24 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 27 · build, test, gates
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (expects macOS 27 + Xcode 27)
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sw_vers -productVersion | grep -q '^27\.' || { echo "::error::expected a macOS 27 host (package floor is macOS 27)"; exit 1; }
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.' || { echo "::error::expected Xcode 27"; exit 1; }
      - name: swift package dump-package
        run: swift package dump-package > /dev/null
      - name: swift build --build-tests
        run: swift build --build-tests
      - name: swift test (non-corpus)
        run: swift test --skip "CorpusSnapshotTests" --skip "CorpusMultiFormatSnapshotTests"
      - name: swift test (round-trip)
        run: swift test --filter "RoundTrip"
      - name: swift test (corpus SVG)
        run: swift test --filter "CorpusSnapshotTests/svgSnapshot"
      - name: swift test (corpus ASCII)
        run: swift test --filter "CorpusSnapshotTests/asciiSnapshot"
      - name: swift test (corpus image)
        run: swift test --filter "CorpusSnapshotTests/imageSnapshot"
      - name: swift test (corpus multi-format SVG)
        run: swift test --filter "CorpusMultiFormatSnapshotTests/multiFormatSvgSnapshot"
      - name: swift test (corpus multi-format image)
        run: swift test --filter "CorpusMultiFormatSnapshotTests/multiFormatImageSnapshot"
      - name: Put Bash 5 on PATH for the gate scripts
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Scripts/check-file-sizes.sh
        run: ./Scripts/check-file-sizes.sh
      - name: Scripts/check-sendable-annotations.sh
        run: ./Scripts/check-sendable-annotations.sh
      - name: Scripts/strict-concurrency-check.sh
        run: ./Scripts/strict-concurrency-check.sh
      - name: Scripts/check-diagnostic-discipline.sh
        run: ./Scripts/check-diagnostic-discipline.sh
      - name: Scripts/check-diagnostic-discipline-tests/run.sh
        run: ./Scripts/check-diagnostic-discipline-tests/run.sh
      - name: Scripts/check-stale-phase-comments.sh
        run: ./Scripts/check-stale-phase-comments.sh
      - name: Scripts/check-linux-check-runtime-skip.sh
        run: ./Scripts/check-linux-check-runtime-skip.sh
      - name: Crash reports (on failure)
        if: failure()
        run: |
          shopt -s nullglob
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "::group::$f"; head -c 60000 "$f"; echo; echo "::endgroup::"
          done

  linux:
    # Every target builds and the whole portable test suite runs on Linux
    # (Apple-only test files compile to empty), including CorpusRenderTests,
    # which renders every corpus diagram to SVG and ASCII. Same image as
    # DiagramKit's Scripts/linux-check.sh.
    name: Linux · build & test
    runs-on: ubuntu-24.04
    container: swift:6.3.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: swift build --build-tests
        run: swift build --build-tests
      - name: swift test
        run: swift test

  ios:
    name: iOS 27 · build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: xcodebuild generic/platform=iOS
        run: xcodebuild -scheme DiagramKit-Package -destination 'generic/platform=iOS' -quiet build CODE_SIGNING_ALLOWED=NO
