name: MermaidPlayground
options:
  bundleIdPrefix: com.lukilabs
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  DiagramKit:
    path: ../..
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
targets:
  MermaidPlayground:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - MermaidPlaygroundApp.swift
      - Models
      - Views
    resources:
      - Resources
    dependencies:
      - package: DiagramKit
        product: DiagramKit
      - package: xctest-dynamic-overlay
        product: IssueReporting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukilabs.MermaidPlayground
        PRODUCT_NAME: MermaidPlayground
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
  MermaidPlayground-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MermaidPlaygroundApp.swift
      - Models
      - Views
    resources:
      - Resources
    dependencies:
      - package: DiagramKit
        product: DiagramKit
      - package: xctest-dynamic-overlay
        product: IssueReporting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukilabs.MermaidPlayground.iOS
        PRODUCT_NAME: MermaidPlayground
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
schemes:
  MermaidPlayground:
    build:
      targets:
        MermaidPlayground: all
    run:
      config: Debug
    archive:
      config: Release
  MermaidPlayground-iOS:
    build:
      targets:
        MermaidPlayground-iOS: all
    run:
      config: Debug
    archive:
      config: Release
