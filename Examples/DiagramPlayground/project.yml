name: DiagramPlayground
options:
  bundleIdPrefix: com.lukilabs
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  DiagramKit:
    path: ../..
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: YES
targets:
  DiagramPlayground:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - DiagramPlaygroundApp.swift
      - Models
      - Views
    resources:
      - Resources
    dependencies:
      - package: DiagramKit
        product: DiagramKit
      - package: DiagramKit
        product: DiagramKitD2
      - package: DiagramKit
        product: DiagramKitGraphviz
      - package: DiagramKit
        product: DiagramKitStructurizr
      - package: DiagramKit
        product: DiagramKitPlantUML
      - package: DiagramKit
        product: DiagramKitInteractive
      - package: xctest-dynamic-overlay
        product: IssueReporting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukilabs.DiagramPlayground
        PRODUCT_NAME: DiagramPlayground
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
  DiagramPlayground-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - DiagramPlaygroundApp.swift
      - Models
      - Views
    resources:
      - Resources
    dependencies:
      - package: DiagramKit
        product: DiagramKit
      - package: DiagramKit
        product: DiagramKitD2
      - package: DiagramKit
        product: DiagramKitGraphviz
      - package: DiagramKit
        product: DiagramKitStructurizr
      - package: DiagramKit
        product: DiagramKitPlantUML
      - package: DiagramKit
        product: DiagramKitInteractive
      - package: xctest-dynamic-overlay
        product: IssueReporting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukilabs.DiagramPlayground.iOS
        PRODUCT_NAME: DiagramPlayground
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
  DiagramPlaygroundUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - UITests
    dependencies:
      - target: DiagramPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukilabs.DiagramPlaygroundUITests
        TEST_TARGET_NAME: DiagramPlayground
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  DiagramPlayground:
    build:
      targets:
        DiagramPlayground: all
        DiagramPlaygroundUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DiagramPlaygroundUITests
    archive:
      config: Release
  DiagramPlayground-iOS:
    build:
      targets:
        DiagramPlayground-iOS: all
    run:
      config: Debug
    archive:
      config: Release
